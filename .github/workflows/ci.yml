name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
      SUPABASE_SERVICE_ROLE_KEY: veridia_service_role_bundle_canary
      NEXT_PUBLIC_VERCEL_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Supabase CLI
        run: npm install --global supabase@2.111.0

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Run SQL pgTAP tests
        run: supabase db test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify service-role secret is not in client bundle
        run: npm run test:client-bundle-secret
